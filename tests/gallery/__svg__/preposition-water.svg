<div class="not-prose lab-activity language-activity" data-focus-layout="compact"><header class="lab-activity-header"><div class="lab-activity-heading"><span class="lab-activity-eyebrow">Language practice</span><h3>Where is it?</h3><div class="lab-activity-description">Pick the preposition: in English it comes before the noun.</div></div></header><div class="lab-activity-status"><span class="lab-progress" role="group" aria-label="step 0 of 1"><span class="lab-progress-segs" aria-hidden="true"><span class="lab-progress-seg"></span></span><span class="lab-progress-count">0 / 1</span></span></div><div class="lab-activity-workspace"><section class="lab-activity-canvas" aria-label="Language practice"><div class="lang-lab"><div class="lang-scene"><div class="lang-prepscene" role="img" aria-label="🐟 in water"><div class="lang-backdrop" data-kind="water"></div><span class="lang-prepfig" style="left:50%;top:76%;transform:translate(-50%,-50%)" aria-hidden="true">🐟</span></div></div><div class="lang-sentence" aria-label="sentence"><span>The fish is</span><span class="lang-blank" data-state="idle">▢</span><span class="lang-noun">the water.</span></div><div role="radiogroup" class="lab-choices" data-slot="radio-group" aria-label="Choose the preposition that matches the scene"><label for="_R_id_-in" class="lab-choice"><button type="button" role="radio" class="lab-choice-control" aria-checked="false" data-slot="radio-group-item" id="_R_id_-in"></button><span class="lab-choice-label">in</span></label><label for="_R_id_-on" class="lab-choice"><button type="button" role="radio" class="lab-choice-control" aria-checked="false" data-slot="radio-group-item" id="_R_id_-on"></button><span class="lab-choice-label">on</span></label><label for="_R_id_-over" class="lab-choice"><button type="button" role="radio" class="lab-choice-control" aria-checked="false" data-slot="radio-group-item" id="_R_id_-over"></button><span class="lab-choice-label">over</span></label></div></div></section></div><div class="language-activity-support"></div></div>