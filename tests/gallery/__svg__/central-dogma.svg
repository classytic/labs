<div class="not-prose lab-activity biology-central-dogma-activity" data-focus-layout="immersive"><header class="lab-activity-header"><div class="lab-activity-heading"><span class="lab-activity-eyebrow">Information flow</span><h3>The central dogma: DNA → mRNA → protein</h3><div class="lab-activity-description">Transcribe the DNA into mRNA (T→U), then translate each codon into an amino acid.</div></div></header><div class="lab-activity-status"><strong>transcription</strong><span>0/12 mRNA bases</span><span>0/4 codons</span></div><div class="lab-activity-workspace"><section class="lab-activity-canvas" aria-label="DNA to mRNA to protein construction"><div class="biology-model-surface biology-sequence-scene"><div class="biology-molecule-row"><span class="biology-molecule-label">DNA template</span><div class="biology-base-tile" style="--biology-base-color:var(--stage-danger)">T</div><div class="biology-base-tile" style="--biology-base-color:var(--stage-good)">A</div><div class="biology-base-tile" style="--biology-base-color:var(--stage-accent)">C</div><div class="biology-base-tile" style="--biology-base-color:var(--stage-accent-2)">G</div><div class="biology-base-tile" style="--biology-base-color:var(--stage-good)">A</div><div class="biology-base-tile" style="--biology-base-color:var(--stage-good)">A</div><div class="biology-base-tile" style="--biology-base-color:var(--stage-accent)">C</div><div class="biology-base-tile" style="--biology-base-color:var(--stage-accent)">C</div><div class="biology-base-tile" style="--biology-base-color:var(--stage-danger)">T</div><div class="biology-base-tile" style="--biology-base-color:var(--stage-good)">A</div><div class="biology-base-tile" style="--biology-base-color:var(--stage-danger)">T</div><div class="biology-base-tile" style="--biology-base-color:var(--stage-danger)">T</div></div><div class="biology-flow-arrow"><span class="biology-flow-arrow-icon" aria-hidden="true">↓</span> transcription, copy the template, T → U</div><div class="biology-molecule-row"><span class="biology-molecule-label">mRNA</span><button class="biology-sequence-slot" data-variant="ghost" type="button" aria-label="mRNA slot 1">?</button><button class="biology-sequence-slot" data-variant="ghost" type="button" aria-label="mRNA slot 2">?</button><button class="biology-sequence-slot" data-variant="ghost" type="button" aria-label="mRNA slot 3">?</button><button class="biology-sequence-slot" data-variant="ghost" type="button" data-codon-start="true" aria-label="mRNA slot 4">?</button><button class="biology-sequence-slot" data-variant="ghost" type="button" aria-label="mRNA slot 5">?</button><button class="biology-sequence-slot" data-variant="ghost" type="button" aria-label="mRNA slot 6">?</button><button class="biology-sequence-slot" data-variant="ghost" type="button" data-codon-start="true" aria-label="mRNA slot 7">?</button><button class="biology-sequence-slot" data-variant="ghost" type="button" aria-label="mRNA slot 8">?</button><button class="biology-sequence-slot" data-variant="ghost" type="button" aria-label="mRNA slot 9">?</button><button class="biology-sequence-slot" data-variant="ghost" type="button" data-codon-start="true" aria-label="mRNA slot 10">?</button><button class="biology-sequence-slot" data-variant="ghost" type="button" aria-label="mRNA slot 11">?</button><button class="biology-sequence-slot" data-variant="ghost" type="button" aria-label="mRNA slot 12">?</button></div><div class="biology-flow-arrow"><span class="biology-flow-arrow-icon" aria-hidden="true">↓</span> translation, locked until the mRNA is complete</div><div class="biology-molecule-row biology-protein-row" data-locked="true"><span class="biology-molecule-label">protein</span><button class="biology-sequence-slot biology-protein-slot" data-variant="ghost" type="button" disabled="" aria-label="locked">·</button><button class="biology-sequence-slot biology-protein-slot" data-variant="ghost" type="button" disabled="" aria-label="locked">·</button><button class="biology-sequence-slot biology-protein-slot" data-variant="ghost" type="button" disabled="" aria-label="locked">·</button><button class="biology-sequence-slot biology-protein-slot" data-variant="ghost" type="button" disabled="" aria-label="locked">·</button></div></div></section><details class="lab-activity-inspector"><summary>Molecule palettes and progress</summary><div class="lab-activity-inspector-body"><div class="biology-sequence-controls"><div class="biology-palette-group"><span class="lab-field-label">bases</span><div class="lab-field-row" role="group" aria-label="mRNA base palette"><button class="lab-chip" data-variant="outline" data-size="sm" type="button" data-sel="false" aria-pressed="false"><span class="biology-base-choice" style="--biology-base-color:var(--stage-good)">A</span></button><button class="lab-chip" data-variant="outline" data-size="sm" type="button" data-sel="false" aria-pressed="false"><span class="biology-base-choice" style="--biology-base-color:var(--stage-warn)">U</span></button><button class="lab-chip" data-variant="outline" data-size="sm" type="button" data-sel="false" aria-pressed="false"><span class="biology-base-choice" style="--biology-base-color:var(--stage-accent-2)">G</span></button><button class="lab-chip" data-variant="outline" data-size="sm" type="button" data-sel="false" aria-pressed="false"><span class="biology-base-choice" style="--biology-base-color:var(--stage-accent)">C</span></button></div><span class="lab-pill" data-variant="outline" data-state="no">0/12 mRNA</span></div><div class="biology-palette-group biology-protein-controls" data-locked="true"><span class="lab-field-label">amino acids</span><div class="lab-field-row" role="group" aria-label="Amino-acid palette"><button class="lab-chip" data-variant="outline" data-size="sm" type="button" data-sel="false" aria-pressed="false">Gly</button><button class="lab-chip" data-variant="outline" data-size="sm" type="button" data-sel="false" aria-pressed="false">Leu</button><button class="lab-chip" data-variant="outline" data-size="sm" type="button" data-sel="false" aria-pressed="false">Met</button><button class="lab-chip" data-variant="outline" data-size="sm" type="button" data-sel="false" aria-pressed="false">Phe</button><button class="lab-chip" data-variant="outline" data-size="sm" type="button" data-sel="false" aria-pressed="false">Ser</button><button class="lab-chip" data-variant="outline" data-size="sm" type="button" data-sel="false" aria-pressed="false">Stop</button></div><span class="lab-pill" data-variant="outline" data-state="no">0/4 codons</span></div><p class="biology-sequence-guidance">Complete transcription first. Translation unlocks only when every mRNA base is correct.</p></div></div></details></div><div class="lab-activity-feedback"><span>Observe</span><div>Transcription uses complementary pairing, with U in RNA where DNA would use T.</div></div><section class="lab-authored-task" aria-label="Transfer the information flow"><div class="lab-challenge"><span class="lab-challenge-h">Transfer the information flow</span><fieldset class="lab-challenge-q" data-response-layout="prose"><legend class="lab-challenge-prompt"><span>Which molecule is read directly by the ribosome during translation?</span></legend><div role="radiogroup" class="lab-choices" data-slot="radio-group" aria-label="Which molecule is read directly by the ribosome during translation?"><label for="_R_id_-mrna" class="lab-choice"><button type="button" role="radio" class="lab-choice-control" aria-checked="false" data-slot="radio-group-item" id="_R_id_-mrna"></button><span class="lab-choice-label">mRNA codons</span></label><label for="_R_id_-dna" class="lab-choice"><button type="button" role="radio" class="lab-choice-control" aria-checked="false" data-slot="radio-group-item" id="_R_id_-dna"></button><span class="lab-choice-label">the DNA template inside the nucleus</span></label><label for="_R_id_-protein" class="lab-choice"><button type="button" role="radio" class="lab-choice-control" aria-checked="false" data-slot="radio-group-item" id="_R_id_-protein"></button><span class="lab-choice-label">the finished protein</span></label></div></fieldset></div></section><div aria-live="polite" class="lab-sr-only">0 of 12 mRNA bases paired.</div><footer class="lab-activity-transport"><button class="lab-icon-button" data-variant="outline" data-size="icon-sm" type="button" aria-label="Reset central dogma construction" title="Reset central dogma construction"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-rotate-ccw" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg></button><div class="lab-transport-state" aria-live="polite"><strong>Transcribe the DNA</strong><span>0 / 12 bases</span></div></footer></div>