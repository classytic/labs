<div class="not-prose lab-activity math-identity-proof" data-focus-layout="standard"><header class="lab-activity-header"><div class="lab-activity-heading"><span class="lab-activity-eyebrow">Trigonometry</span><h3>Prove the identity: choosing the move is the skill</h3><div class="lab-activity-description">Every move below is legal algebra. Only one gets closer to the other side, and the rest are answered with the reason they lead nowhere.</div></div></header><div class="lab-activity-status"><strong>step 1 of 2</strong><span>working the left side</span><span>no detours yet</span></div><div class="lab-activity-workspace"><section class="lab-activity-canvas" aria-label="The identity and the working so far"><div class="lab-proof-claim"><span class="lab-eyebrow">Prove that</span><span><span class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>tan</mi><mo>⁡</mo><mi>θ</mi><mi>cos</mi><mo>⁡</mo><mi>θ</mi><mo>≡</mo><mi>sin</mi><mo>⁡</mo><mi>θ</mi></mrow><annotation encoding="application/x-tex">\tan\theta\cos\theta \equiv \sin\theta</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6944em;"></span><span class="mop">tan</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal" style="margin-right:0.0278em;">θ</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mop">cos</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal" style="margin-right:0.0278em;">θ</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">≡</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.6944em;"></span><span class="mop">sin</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal" style="margin-right:0.0278em;">θ</span></span></span></span></span></span></div><ol class="lab-proof-working"><li data-latest="true"><span><span class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>tan</mi><mo>⁡</mo><mi>θ</mi><mi>cos</mi><mo>⁡</mo><mi>θ</mi></mrow><annotation encoding="application/x-tex">\tan\theta\cos\theta</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6944em;"></span><span class="mop">tan</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal" style="margin-right:0.0278em;">θ</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mop">cos</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal" style="margin-right:0.0278em;">θ</span></span></span></span></span></span></li></ol></section><section class="lab-activity-dock" aria-label="Model controls"><div class="lab-proof-choice"><span class="lab-field-label">What do you do next?</span><div class="lab-proof-menu"><button class="lab-chip" data-variant="outline" data-size="sm" type="button" data-sel="false" aria-pressed="false">Write every function in terms of sin θ and cos θ</button><button class="lab-chip" data-variant="outline" data-size="sm" type="button" data-sel="false" aria-pressed="false">Square both sides</button><button class="lab-chip" data-variant="outline" data-size="sm" type="button" data-sel="false" aria-pressed="false">Replace 1 − cos²θ with sin²θ</button></div></div></section><div class="lab-evidence-surface" data-tone="result"><span class="lab-readout"><span class="lab-readout-val">Start from the left-hand side</span><span class="lab-readout-sub">It is the messier one, so there is something to cancel and a fixed target to aim at.</span></span></div></div><div class="lab-activity-feedback"><span>The two rules</span><div>Work on <strong>one side only</strong>. Anything done to both sides at once, such as squaring or cross-multiplying, assumes the identity you are trying to prove and scores nothing. And start from the <strong>messier side</strong>: it has terms to cancel, and the simpler side sits there as the target you are aiming at.</div></div><div aria-live="polite" class="lab-sr-only">Step 1 of 2. </div></div>