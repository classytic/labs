ass="pstrut" style="height:3em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0315em;">k</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal">A</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord">Δ</span><span class="mord mathnormal" style="margin-right:0.1389em;">T</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.686em;"><span></span></span></span></span></span><span class="mclose nulldelimiter"></span></span></span></span></span></span></span><span class="physics-explain">conduction = atom-to-atom through a solid. <strong class="physics-emphasis">Copper</strong> has k = 400 W/m·K, metals conduct ~1000× better than wood.</span></div></section></div></details></div><div class="lab-activity-feedback"><span>Observe</span><div>Energy passes between neighboring particles; high conductivity and a short path increase the rate.</div></div><footer class="lab-activity-transport"><nav class="lab-sequence" aria-label="Learning activity steps"><div class="lab-sequence-actions"><button class="lab-btn lab-btn-ghost" data-variant="outline" type="button" disabled="" aria-label="Back">← Back</button><span class="lab-sequence-count" aria-live="polite">1 / 5</span><button class="lab-btn" data-variant="default" type="button">Continue</button></div></nav></footer></div>