<div class="not-prose lab-activity biology-genetic-cross-activity" data-focus-layout="immersive"><header class="lab-activity-header"><div class="lab-activity-heading"><span class="lab-activity-eyebrow">Inheritance</span><h3>Blood groups (A0 × B0)</h3><div class="lab-activity-description">Alleles segregate into gametes, recombine, and the ratio falls out.</div></div></header><div class="lab-activity-status"><strong>blood type revealed</strong><span>2 × 2 pairings</span><span>ratio 1:1:1:1</span></div><div class="lab-activity-workspace"><section class="lab-activity-canvas" aria-label="Punnett grid and parent gametes"><p class="genetic-legend"><span>Trait: blood type · <span><b class="genetic-phenotype" style="--genetic-color:var(--stage-accent)">A</b>=A, </span><span><b class="genetic-phenotype" style="--genetic-color:var(--stage-accent-2)">B</b>=B, </span><span><b class="genetic-phenotype" style="--genetic-color:var(--stage-muted)">O</b>=O</span></span></p><div class="biology-model-surface genetic-cross-scene"><div role="table" class="genetic-cross-grid" aria-label="Punnett grid, 2 by 2. blood type ratio 1 AB, 1 A, 1 B, 1 O." style="--genetic-cell-size:54px;--genetic-columns:2;--genetic-font-size:17px"><div role="row" class="genetic-cross-row"><div role="columnheader" aria-hidden="true" class="genetic-cross-corner"></div><div role="columnheader" class="genetic-cross-column-header">B</div><div role="columnheader" class="genetic-cross-column-header">O</div></div><div role="row" class="genetic-cross-row"><div role="rowheader" class="genetic-cross-row-header">A</div><button class="genetic-cross-cell" data-variant="ghost" type="button" role="cell" data-revealed="true" aria-label="A × B → AB, AB" title="AB → AB" style="--genetic-cell-bg:color-mix(in oklab, var(--stage-good) 13%, var(--stage-bg))">AB</button><button class="genetic-cross-cell" data-variant="ghost" type="button" role="cell" data-revealed="true" aria-label="A × O → AO, A" title="AO → A" style="--genetic-cell-bg:color-mix(in oklab, var(--stage-accent) 13%, var(--stage-bg))">AO</button></div><div role="row" class="genetic-cross-row"><div role="rowheader" class="genetic-cross-row-header">O</div><button class="genetic-cross-cell" data-variant="ghost" type="button" role="cell" data-revealed="true" aria-label="O × B → BO, B" title="BO → B" style="--genetic-cell-bg:color-mix(in oklab, var(--stage-accent-2) 13%, var(--stage-bg))">BO</button><button class="genetic-cross-cell" data-variant="ghost" type="button" role="cell" data-revealed="true" aria-label="O × O → OO, O" title="OO → O" style="--genetic-cell-bg:color-mix(in oklab, var(--stage-muted) 13%, var(--stage-bg))">OO</button></div></div></div></section><details class="lab-activity-inspector"><summary>Parent alleles and offspring evidence</summary><div class="lab-activity-inspector-body"><div class="genetic-cross-inspector"><div class="genetic-parent-controls"><span class="genetic-parent-row">Parent 1:<span class="genetic-allele-pair"><button class="lab-chip genetic-allele-button" data-variant="outline" data-size="sm" type="button" style="--genetic-color:var(--stage-accent)" aria-label="Parent 1 gene 1 allele 1: A, tap to change">A</button><button class="lab-chip genetic-allele-button" data-variant="outline" data-size="sm" type="button" style="--genetic-color:var(--stage-muted)" aria-label="Parent 1 gene 1 allele 2: O, tap to change">O</button></span></span><span class="genetic-parent-row">Parent 2:<span class="genetic-allele-pair"><button class="lab-chip genetic-allele-button" data-variant="outline" data-size="sm" type="button" style="--genetic-color:var(--stage-accent-2)" aria-label="Parent 2 gene 1 allele 1: B, tap to change">B</button><button class="lab-chip genetic-allele-button" data-variant="outline" data-size="sm" type="button" style="--genetic-color:var(--stage-muted)" aria-label="Parent 2 gene 1 allele 2: O, tap to change">O</button></span></span><span class="genetic-control-hint">(tap an allele to cycle it)</span></div><div class="genetic-tally-stack"><div class="genetic-tally"><div class="genetic-tally-label">Genotype: 1 AB : 1 AO : 1 BO : 1 OO</div><div class="genetic-tally-bar"><div class="genetic-tally-segment" style="--genetic-share:0.25;--genetic-color:var(--stage-good)">1</div><div class="genetic-tally-segment" style="--genetic-share:0.25;--genetic-color:var(--stage-accent)">1</div><div class="genetic-tally-segment" style="--genetic-share:0.25;--genetic-color:var(--stage-accent-2)">1</div><div class="genetic-tally-segment" style="--genetic-share:0.25;--genetic-color:var(--stage-muted)">1</div></div></div><div class="genetic-tally"><div class="genetic-tally-label">blood type: 1 AB : 1 A : 1 B : 1 O</div><div class="genetic-tally-bar"><div class="genetic-tally-segment" style="--genetic-share:0.25;--genetic-color:var(--stage-good)">1</div><div class="genetic-tally-segment" style="--genetic-share:0.25;--genetic-color:var(--stage-accent)">1</div><div class="genetic-tally-segment" style="--genetic-share:0.25;--genetic-color:var(--stage-accent-2)">1</div><div class="genetic-tally-segment" style="--genetic-share:0.25;--genetic-color:var(--stage-muted)">1</div></div></div><span class="lab-pill" data-variant="secondary" data-state="ok">1:1:1:1 AB : A : B : O</span></div></div></div></details></div><div class="lab-activity-feedback"><span>Observe</span><div>Each box represents one possible offspring outcome. Counting the blood type outcomes gives 1:1:1:1.</div></div><div aria-live="polite" class="lab-sr-only">blood type ratio 1 AB, 1 A, 1 B, 1 O.</div><footer class="lab-activity-transport"><div class="lab-transport-state" aria-live="polite"><strong>Cross revealed</strong><span>4 offspring outcomes</span></div></footer></div>