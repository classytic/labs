<div class="not-prose lab-activity language-activity" data-focus-layout="compact"><header class="lab-activity-header"><div class="lab-activity-heading"><span class="lab-activity-eyebrow">Language practice</span><h3>Where is it?</h3><div class="lab-activity-description">Pick the preposition: in English it comes before the noun.</div></div></header><div class="lab-activity-status"><span class="lab-progress" role="group" aria-label="step 0 of 1"><span class="lab-progress-segs" aria-hidden="true"><span class="lab-progress-seg"></span></span><span class="lab-progress-count">0 / 1</span></span></div><div class="lab-activity-workspace"><section class="lab-activity-canvas" aria-label="Language practice"><div class="lang-lab"><div class="lang-scene"><div class="lang-prepscene" role="img" aria-label="🐦 above 🌳"><span class="lang-preplandmark" aria-hidden="true">🌳</span><span class="lang-prepfig" style="left:50%;top:20%;transform:translate(-50%,-50%)" aria-hidden="true">🐦</span></div></div><div class="lang-sentence" aria-label="sentence"><span>The bird is</span><span class="lang-blank" data-state="idle">▢</span><span class="lang-noun">the tree.</span></div><div role="radiogroup" class="lab-choices" data-slot="toggle-group" data-orientation="horizontal" aria-label="Choose the preposition that matches the scene"><button type="button" class="lab-choice" data-slot="toggle-group-item" data-state="off" aria-pressed="false" role="radio" aria-checked="false" tabindex="0">above</button><button type="button" class="lab-choice" data-slot="toggle-group-item" data-state="off" aria-pressed="false" role="radio" aria-checked="false" tabindex="-1">in</button><button type="button" class="lab-choice" data-slot="toggle-group-item" data-state="off" aria-pressed="false" role="radio" aria-checked="false" tabindex="-1">under</button></div></div></section></div><div class="language-activity-support"></div></div>