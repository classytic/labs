<div class="not-prose lab-activity biology-sequence-activity" data-focus-layout="immersive"><header class="lab-activity-header"><div class="lab-activity-heading"><span class="lab-activity-eyebrow">Molecular genetics</span><h3>Translation, read codons into protein</h3><div class="lab-activity-description">Each 3-base codon codes for one amino acid. Read the chain off the genetic code.</div></div></header><div class="lab-activity-status"><strong>translation</strong><span>0 of 5 paired</span><span>choose a unit</span></div><div class="lab-activity-workspace"><section class="lab-activity-canvas" aria-label="translation sequence construction"><div class="biology-model-surface biology-sequence-scene" data-wide="true"><div class="biology-molecule-row biology-template-row"><span class="biology-molecule-label">mRNA codons</span><div class="biology-base-tile" style="--biology-base-color:color-mix(in oklab, var(--stage-fg) 26%, var(--stage-bg))">AUG</div><div class="biology-base-tile" style="--biology-base-color:color-mix(in oklab, var(--stage-fg) 26%, var(--stage-bg))">UUU</div><div class="biology-base-tile" style="--biology-base-color:color-mix(in oklab, var(--stage-fg) 26%, var(--stage-bg))">GGA</div><div class="biology-base-tile" style="--biology-base-color:color-mix(in oklab, var(--stage-fg) 26%, var(--stage-bg))">UAC</div><div class="biology-base-tile" style="--biology-base-color:color-mix(in oklab, var(--stage-fg) 26%, var(--stage-bg))">UAA</div></div><div class="biology-molecule-row biology-rung-row" aria-hidden="true"><span class="biology-molecule-label"></span><div class="biology-rung">↓</div><div class="biology-rung">↓</div><div class="biology-rung">↓</div><div class="biology-rung">↓</div><div class="biology-rung">↓</div></div><div class="biology-molecule-row biology-partner-row"><span class="biology-molecule-label">amino acids</span><button class="biology-sequence-slot" data-variant="ghost" type="button" aria-label="empty slot under AUG">?</button><button class="biology-sequence-slot" data-variant="ghost" type="button" aria-label="empty slot under UUU">?</button><button class="biology-sequence-slot" data-variant="ghost" type="button" aria-label="empty slot under GGA">?</button><button class="biology-sequence-slot" data-variant="ghost" type="button" aria-label="empty slot under UAC">?</button><button class="biology-sequence-slot" data-variant="ghost" type="button" aria-label="empty slot under UAA">?</button></div></div></section><details class="lab-activity-inspector"><summary>Sequence palette and construction evidence</summary><div class="lab-activity-inspector-body"><div class="biology-sequence-controls"><span class="lab-field-label">Choose an amino acid</span><div class="lab-field-row" role="group" aria-label="Amino-acid palette"><button class="lab-chip" data-variant="outline" data-size="sm" type="button" data-sel="false" aria-pressed="false"><span class="biology-base-choice" style="--biology-base-color:inherit">Gly</span></button><button class="lab-chip" data-variant="outline" data-size="sm" type="button" data-sel="false" aria-pressed="false"><span class="biology-base-choice" style="--biology-base-color:inherit">Leu</span></button><button class="lab-chip" data-variant="outline" data-size="sm" type="button" data-sel="false" aria-pressed="false"><span class="biology-base-choice" style="--biology-base-color:inherit">Met</span></button><button class="lab-chip" data-variant="outline" data-size="sm" type="button" data-sel="false" aria-pressed="false"><span class="biology-base-choice" style="--biology-base-color:inherit">Phe</span></button><button class="lab-chip" data-variant="outline" data-size="sm" type="button" data-sel="false" aria-pressed="false"><span class="biology-base-choice" style="--biology-base-color:inherit">Ser</span></button><button class="lab-chip" data-variant="outline" data-size="sm" type="button" data-sel="false" aria-pressed="false"><span class="biology-base-choice" style="--biology-base-color:inherit">Tyr</span></button><button class="lab-chip" data-variant="outline" data-size="sm" type="button" data-sel="false" aria-pressed="false"><span class="biology-base-choice" style="--biology-base-color:inherit">Stop</span></button></div><span class="lab-pill" data-variant="outline" data-state="no">0/5 paired</span><p class="biology-sequence-guidance">Choose one option, then place it in the matching slot. A correct match locks in place.</p></div></div></details></div><div class="lab-activity-feedback"><span>Observe</span><div>Pair each codon with the amino acid specified by the genetic code.</div></div><section class="lab-authored-task" aria-label="Transfer the sequence rule"><div class="lab-challenge"><span class="lab-challenge-h">Transfer the sequence rule</span><div class="lab-challenge-q" data-response-layout="prose"><span class="lab-challenge-prompt"><span>A mutation changes an mRNA codon. What determines whether the protein changes?</span></span><div role="radiogroup" class="lab-choices" data-slot="toggle-group" data-orientation="horizontal" aria-label="A mutation changes an mRNA codon. What determines whether the protein changes?"><button type="button" class="lab-choice" data-slot="toggle-group-item" data-state="off" aria-pressed="false" role="radio" aria-checked="false" tabindex="0">whether the new codon specifies a different amino acid or stop</button><button type="button" class="lab-choice" data-slot="toggle-group-item" data-state="off" aria-pressed="false" role="radio" aria-checked="false" tabindex="-1">whether the codon contains the letter T</button></div></div></div></section><div aria-live="polite" class="lab-sr-only">0 of 5 paired.</div><footer class="lab-activity-transport"><button class="lab-icon-button" data-variant="outline" data-size="icon-sm" type="button" aria-label="Reset sequence construction" title="Reset sequence construction"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-widt