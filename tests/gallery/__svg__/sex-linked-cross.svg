<div class="not-prose lab-activity biology-genetic-cross-activity" data-focus-layout="immersive"><header class="lab-activity-header"><div class="lab-activity-heading"><span class="lab-activity-eyebrow">Inheritance</span><h3>Sex linkage, why mostly sons are affected</h3><div class="lab-activity-description">The gene rides on the X. A carrier mother passes it to half her sons, who, with no second X, show it.</div></div></header><div class="lab-activity-status"><strong>phenotype &amp; sex revealed</strong><span>2 × 2 pairings</span><span>ratio 2:1:1</span></div><div class="lab-activity-workspace"><section class="lab-activity-canvas" aria-label="Punnett grid and parent gametes"><p class="genetic-legend">X-linked gene: <b class="genetic-phenotype" style="--genetic-color:var(--stage-good)">Xᴮ</b>=normal (dominant), <b class="genetic-phenotype" style="--genetic-color:var(--stage-danger)">Xᵇ</b>=colour-blind (recessive). The <b>Y</b> carries no copy.</p><div class="biology-model-surface genetic-cross-scene"><div role="table" class="genetic-cross-grid" aria-label="Punnett grid, 2 by 2. phenotype &amp; sex ratio 2 normal ♀, 1 normal ♂, 1 colour-blind ♂." style="--genetic-cell-size:54px;--genetic-columns:2;--genetic-font-size:17px"><div role="row" class="genetic-cross-row"><div role="columnheader" aria-hidden="true" class="genetic-cross-corner"></div><div role="columnheader" class="genetic-cross-column-header">Xᴮ</div><div role="columnheader" class="genetic-cross-column-header">Y</div></div><div role="row" class="genetic-cross-row"><div role="rowheader" class="genetic-cross-row-header">Xᴮ</div><button class="genetic-cross-cell" data-variant="ghost" type="button" role="cell" data-revealed="true" aria-label="Xᴮ × Xᴮ → XᴮXᴮ, normal ♀" title="XᴮXᴮ → normal ♀" style="--genetic-cell-bg:color-mix(in oklab, var(--stage-good) 13%, var(--stage-bg))">XᴮXᴮ</button><button class="genetic-cross-cell" data-variant="ghost" type="button" role="cell" data-revealed="true" aria-label="Xᴮ × Y → XᴮY, normal ♂" title="XᴮY → normal ♂" style="--genetic-cell-bg:color-mix(in oklab, var(--stage-accent) 13%, var(--stage-bg))">XᴮY</button></div><div role="row" class="genetic-cross-row"><div role="rowheader" class="genetic-cross-row-header">Xᵇ</div><button class="genetic-cross-cell" data-variant="ghost" type="button" role="cell" data-revealed="true" aria-label="Xᵇ × Xᴮ → XᴮXᵇ, normal ♀" title="XᴮXᵇ → normal ♀" style="--genetic-cell-bg:color-mix(in oklab, var(--stage-good) 13%, var(--stage-bg))">XᴮXᵇ</button><button class="genetic-cross-cell" data-variant="ghost" type="button" role="cell" data-revealed="true" aria-label="Xᵇ × Y → XᵇY, colour-blind ♂" title="XᵇY → colour-blind ♂" style="--genetic-cell-bg:color-mix(in oklab, var(--stage-warn) 13%, var(--stage-bg))">XᵇY</button></div></div></div></section><details class="lab-activity-inspector"><summary>Parent alleles and offspring evidence</summary><div class="lab-activity-inspector-body"><div class="genetic-cross-inspector"><div class="genetic-parent-controls"><span class="genetic-parent-row">Mother ♀:<button class="lab-chip genetic-allele-button genetic-allele-button-wide" data-variant="outline" data-size="sm" type="button" style="--genetic-color:var(--stage-good)" aria-label="mother first X allele">Xᴮ</button><button class="lab-chip genetic-allele-button genetic-allele-button-wide" data-variant="outline" data-size="sm" type="button" style="--genetic-color:var(--stage-danger)" aria-label="mother second X allele">Xᵇ</button></span><span class="genetic-parent-row">Father ♂:<button class="lab-chip genetic-allele-button genetic-allele-button-wide" data-variant="outline" data-size="sm" type="button" style="--genetic-color:var(--stage-good)" aria-label="father X allele">Xᴮ</button><span class="genetic-y-token">Y</span></span><span class="genetic-control-hint">(tap an X allele to switch Xᴮ/Xᵇ)</span></div><div class="genetic-tally-stack"><div class="genetic-tally"><div class="genetic-tally-label">Genotype: 1 XᴮXᴮ : 1 XᴮY : 1 XᴮXᵇ : 1 XᵇY</div><div class="genetic-tally-bar"><div class="genetic-tally-segment" style="--genetic-share:0.25;--genetic-color:var(--stage-good)">1</div><div class="genetic-tally-segment" style="--genetic-share:0.25;--genetic-color:var(--stage-accent)">1</div><div class="genetic-tally-segment" style="--genetic-share:0.25;--genetic-color:var(--stage-good)">1</div><div class="genetic-tally-segment" style="--genetic-share:0.25;--genetic-color:var(--stage-warn)">1</div></div></div><div class="genetic-tally"><div class="genetic-tally-label">phenotype &amp; sex: 2 normal ♀ : 1 normal ♂ : 1 colour-blind ♂</div><div class="genetic-tally-bar"><div class="genetic-tally-segment" style="--genetic-share:0.5;--genetic-color:var(--stage-good)">2</div><div class="genetic-tally-segment" style="--genetic-share:0.25;--genetic-color:var(--stage-accent)">1</div><div class="genetic-tally-segment" style="--genetic-share:0.25;--genetic-color:var(--stage-warn)">1</div></div></div><span class="lab-pill" data-variant="secondary" data-state="ok">2:1:1 normal ♀ : normal ♂ : colour-blind ♂</span></div></div></div></details></div><div class="lab-activity-feedback"><span>Observe</span><div>Each box represents one possible offspring outcome. Counting the phenotype &amp; sex outcomes gives 2:1:1.</div></div><div aria-live="polite" class="lab-sr-only">phenotype &amp; sex ratio 2 normal ♀, 1 normal ♂, 1 colour-blind ♂.</div><footer class="lab-activity-transport"><div class="lab-transport-state" aria-live="polite"><strong>Cross revealed</strong><span>4 offspring outcomes</span></div></footer></div>