<div class="not-prose lab-activity lab-exam-question" data-focus-layout="compact"><header class="lab-activity-header"><div class="lab-activity-heading"><span class="lab-activity-eyebrow">9702 Paper 2, question 1</span><h3>4-mark structured question</h3><div class="lab-activity-description">A trolley runs at a steady speed along a level track. Air resistance is negligible.</div></div></header><div class="lab-activity-status"><strong>0 / 4</strong><span>2 parts</span><span>no options given</span></div><div class="lab-activity-workspace"><div class="lab-exam-parts"><section class="lab-exam-part" aria-label="Part a"><header class="lab-exam-part-head"><strong>(a)</strong><span class="lab-exam-marks">[2 marks]</span></header><p class="lab-exam-prompt">A trolley travels 12.0 m in 4.0 s at constant speed. Calculate its speed.</p><p class="lab-exam-command">Command word: <strong>calculate</strong></p><div class="lab-field-row"><input data-slot="input" placeholder="your answer" aria-label="Answer to part a" class="lab-exam-input" value=""/><span class="lab-exam-unit">m/s</span><button data-size="sm" type="button" disabled="">Check</button><button class="lab-exam-reveal" data-variant="ghost" data-size="sm" type="button">Show mark scheme</button></div></section><section class="lab-exam-part" aria-label="Part b"><header class="lab-exam-part-head"><strong>(b)</strong><span class="lab-exam-marks">[2 marks]</span></header><p class="lab-exam-prompt">Explain why the trolley travelling at constant speed still has a resultant force of zero.</p><p class="lab-exam-command">Command word: <strong>explain</strong></p><p class="lab-exam-note">Write your answer on paper, then read the mark scheme and mark it yourself.</p><details class="lab-exam-scheme"><summary>Mark scheme</summary><ul><li>constant speed in a straight line means zero acceleration <span class="lab-exam-marks">[1 mark]</span></li><li>and F = ma, so a zero acceleration means a zero resultant force <span class="lab-exam-marks">[1 mark]</span></li></ul></details></section></div></div><div class="lab-activity-feedback"><span>Marks</span><div>An examiner awards the marks in the scheme, not the final number alone. A right answer with no working can still lose the method marks.</div></div></div>