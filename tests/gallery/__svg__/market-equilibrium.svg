<div class="not-prose lab-activity lab-authored-activity" data-focus-layout="standard" data-inspector-layout="stacked"><header class="lab-activity-header"><div class="lab-activity-heading"><span class="lab-activity-eyebrow">Market economics</span><h3>Marshall&#x27;s scissors: where the market clears</h3><div class="lab-activity-description">Drag the price. Above equilibrium → surplus; below → shortage; the gap is Qs − Qd.</div></div></header><div class="lab-activity-status"><span>Predict the pressure</span><span>surplus</span><span>price 6.7</span><span>Qd 2.8</span><span>Qs 8.2</span></div><section class="lab-authored-task" aria-label="Your task"><p class="lab-authored-task-lead">Commit before opening the market model.</p><fieldset class="lab-challenge-q" data-response-layout="prose"><legend class="lab-challenge-prompt">At a price above the equilibrium, the market has…</legend><div role="radiogroup" class="lab-choices" data-slot="radio-group" aria-label="At a price above the equilibrium, the market has…"><label for="_R_id_-surplus" class="lab-choice"><button type="button" role="radio" class="lab-choice-control" aria-checked="false" data-slot="radio-group-item" id="_R_id_-surplus"></button><span class="lab-choice-label">a surplus — sellers cut the price</span></label><label for="_R_id_-shortage" class="lab-choice"><button type="button" role="radio" class="lab-choice-control" aria-checked="false" data-slot="radio-group-item" id="_R_id_-shortage"></button><span class="lab-choice-label">a shortage — buyers bid it up</span></label><label for="_R_id_-clears" class="lab-choice"><button type="button" role="radio" class="lab-choice-control" aria-checked="false" data-slot="radio-group-item" id="_R_id_-clears"></button><span class="lab-choice-label">it still clears</span></label></div></fieldset></section><div class="lab-activity-workspace"><section class="lab-activity-canvas" aria-label="Marshall&#x27;s scissors: where the market clears model"><div class="commerce-model-lock"><strong>Predict the market pressure first</strong><span>The supply-and-demand model opens after you commit.</span></div></section></div><details class="lab-activity-transcript"><summary>Event transcript</summary><section class="lab-authored-transcript" aria-label="Event transcript"><p>At price 6.7 for the good, quantity demanded is 2.8 and quantity supplied is 8.2. The market has a surplus. Equilibrium is price 4.7 and quantity 5.3.</p></section></details><footer class="lab-activity-transport"><nav class="lab-sequence" aria-label="Learning activity steps"><div class="lab-sequence-actions"><button class="lab-btn lab-btn-ghost" data-variant="outline" type="button" disabled="" aria-label="Back">← Back</button><span class="lab-sequence-count" aria-live="polite">1 / 5</span><button class="lab-btn" data-variant="default" type="button" disabled="">Continue</button></div><p class="lab-sequence-gate" role="status">Choose what happens above equilibrium.</p></nav></footer></div>