<div class="not-prose lab-activity biology-genetic-cross-activity" data-focus-layout="immersive"><header class="lab-activity-header"><div class="lab-activity-heading"><span class="lab-activity-eyebrow">Inheritance</span><h3>Dihybrid (AaBb × AaBb)</h3><div class="lab-activity-description">Two genes assort independently, four gametes each, sixteen boxes, four phenotype classes.</div></div></header><div class="lab-activity-status"><strong>phenotype revealed</strong><span>4 × 4 pairings</span><span>ratio 9:3:3:1</span></div><div class="lab-activity-workspace"><section class="lab-activity-canvas" aria-label="Punnett grid and parent gametes"><p class="genetic-legend"><span>Gene 1: <span><b class="genetic-phenotype" style="--genetic-color:var(--stage-fg)">A</b>=tall, </span><span><b class="genetic-phenotype" style="--genetic-color:var(--stage-fg)">a</b>=short</span> · </span><span>Gene 2: <span><b class="genetic-phenotype" style="--genetic-color:var(--stage-fg)">B</b>=yellow, </span><span><b class="genetic-phenotype" style="--genetic-color:var(--stage-fg)">b</b>=green</span></span></p><div class="biology-model-surface genetic-cross-scene"><div role="table" class="genetic-cross-grid" aria-label="Punnett grid, 4 by 4. phenotype ratio 9 tall yellow, 3 tall green, 3 short yellow, 1 short green." style="--genetic-cell-size:40px;--genetic-columns:4;--genetic-font-size:13px"><div role="row" class="genetic-cross-row"><div role="columnheader" aria-hidden="true" class="genetic-cross-corner"></div><div role="columnheader" class="genetic-cross-column-header">AB</div><div role="columnheader" class="genetic-cross-column-header">Ab</div><div role="columnheader" class="genetic-cross-column-header">aB</div><div role="columnheader" class="genetic-cross-column-header">ab</div></div><div role="row" class="genetic-cross-row"><div role="rowheader" class="genetic-cross-row-header">AB</div><button class="genetic-cross-cell" data-variant="ghost" type="button" role="cell" data-revealed="true" aria-