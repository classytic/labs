<svg class="lab-figure" data-fig-domain="math" viewBox="0 0 460 200" role="img" aria-label="halving cost derivation for 40 items"><defs><filter id="_R_id_-shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="1.5" stdDeviation="2" style="flood-color:var(--fig-shadow)"></feDropShadow></filter><filter id="_R_id_-glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"></feGaussianBlur></filter></defs><text class="fig-text" data-tone="soft" x="26" y="18" text-anchor="start">what is left after each halving</text><g><rect x="26" y="28" width="300" height="18" rx="2" fill="color-mix(in oklab, var(--fig-hue-1) 60%, var(--fig-paper))"></rect><text class="fig-text" data-tone="soft" x="20" y="42" text-anchor="end">40</text></g><g><rect x="26" y="50" width="150" height="18" rx="2" fill="color-mix(in oklab, var(--fig-hue-1) 56%, var(--fig-paper))"></rect><text class="fig-text" data-tone="soft" x="20" y="64" text-anchor="end">20</text></g><g><rect x="26" y="72" width="75" height="18" rx="2" fill="color-mix(in oklab, var(--fig-hue-1) 52%, var(--fig-paper))"></rect><text class="fig-text" data-tone="soft" x="20" y="86" text-anchor="end">10</text></g><g><rect x="26" y="94" width="37.5" height="18" rx="2" fill="color-mix(in oklab, var(--fig-hue-1) 48%, var(--fig-paper))"></rect><text class="fig-text" data-tone="soft" x="20" y="108" text-anchor="end">5</text></g><g><rect x="26" y="116" width="15" height="18" rx="2" fill="color-mix(in oklab, var(--fig-hue-1) 44%, var(--fig-paper))"></rect><text class="fig-text" data-tone="soft" x="20" y="130" text-anchor="end">2</text></g><g><rect x="26" y="138" width="7.5" height="18" rx="2" fill="var(--fig-hue-2)"></rect><text class="fig-text" data-tone="soft" x="20" y="152" text-anchor="end">1</text></g><text class="fig-text" x="346" y="54" text-anchor="start">n / 2^k = 1</text><text class="fig-text" x="346" y="76" text-anchor="start">2^k = 40</text><text class="fig-text" data-size="measure" x="346" y="108" text-anchor="start">6</text><text class="fig-text" data-tone="soft" x="346" y="130" text-anchor="start">k = log₂ n</text><text class="fig-text" data-tone="hue-2" x="346" y="156" text-anchor="start">grows like log n</text></svg>