<div class="not-prose lab-activity lab-authored-activity" data-focus-layout="standard" data-inspector-layout="stacked"><header class="lab-activity-header"><div class="lab-activity-heading"><span class="lab-activity-eyebrow">Demand responsiveness</span><h3>The stretch test: elasticity is not slope</h3><div class="lab-activity-description">Rotate the curve (substitutes), then drag the price: watch the revenue box + the elasticity flip.</div></div></header><div class="lab-activity-status"><span>Predict the stretch</span><span>elastic</span><span>|E| 2.60</span><span>revenue 20.3</span></div><section class="lab-authored-task" aria-label="Your task"><p class="lab-authored-task-lead">Decide whether elasticity stays fixed on one straight demand line.</p><fieldset class="lab-challenge-q" data-response-layout="prose"><legend class="lab-challenge-prompt">As you slide the price downwards along one straight demand line, its elasticity…</legend><div role="radiogroup" class="lab-choices" data-slot="toggle-group" data-orientation="horizontal" aria-label="As you slide the price downwards along one straight demand line, its elasticity…"><button type="button" class="lab-choice" data-slot="toggle-group-item" data-state="off" aria-pressed="false" role="radio" aria-checked="false" tabindex="0">changes — elastic up top, inelastic near the bottom</button><button type="button" class="lab-choice" data-slot="toggle-group-item" data-state="off" aria-pressed="false" role="radio" aria-checked="false" tabindex="-1">stays the same (it’s one line)</button><button type="button" class="lab-choice" data-slot="toggle-group-item" data-state="off" aria-pressed="false" role="radio" aria-checked="false" tabindex="-1">equals the slope</button></div></fieldset></section><div class="lab-activity-workspace"><section class="lab-activity-canvas" aria-label="The stretch test: elasticity is not slope model"><div class="commerce-model-lock"><strong>Predict before inspecting</strong><span>The demand curve and revenue rectangle open after your forecast.</span></div></section></div><details class="lab-activity-transcript"><summary>Event transcript</summary><section class="lab-authored-transcript" aria-label="Event transcript">Demand slope 0.80. At price 6.5, quantity is 3.1, total revenue is 20.3, and point elasticity is 2.60 (elastic).</section></details><footer class="lab-activity-transport"><nav class="lab-sequence" aria-label="Learning activity steps"><div class="lab-sequence-actions"><button class="lab-btn lab-btn-ghost" data-variant="outline" type="button" disabled="" aria-label="Back">← Back</button><span class="lab-sequence-count" aria-live="polite">1 / 5</span><button class="lab-btn" data-variant="default" type="button" disabled="">Continue</button></div><p class="lab-sequence-gate" role="status">Commit to an elasticity forecast.</p></nav></footer></div>