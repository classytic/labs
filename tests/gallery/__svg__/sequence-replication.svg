<div class="not-prose lab-activity biology-sequence-activity" data-focus-layout="immersive"><header class="lab-activity-header"><div class="lab-activity-heading"><span class="lab-activity-eyebrow">Molecular genetics</span><h3>DNA replication, build the new strand</h3><div class="lab-activity-description">Each base pairs A–T and G–C. The old strand stays; you build its complement.</div></div></header><div class="lab-activity-status"><strong>replication</strong><span>0 of 8 paired</span><span>choose a unit</span></div><div class="lab-activity-workspace"><section class="lab-activity-canvas" aria-label="replication sequence construction"><div class="biology-model-surface biology-sequence-scene"><div class="biology-molecule-row biology-template-row"><span class="biology-molecule-label">template strand (old)</span><div class="biology-base-tile" style="--biology-base-color:var(--stage-danger)">T</div><div class="biology-base-tile" style="--biology-base-color:var(--stage-good)">A</div><div class="biology-base-tile" style="--biology-base-color:var(--stage-accent)">C</div><div class="biology-base-tile" style="--biology-base-color:var(--stage-accent-2)">G</div><div class="biology-base-tile" style="--biology-base-color:var(--stage-accent-2)">G</div><div class="biology-base-tile" style="--biology-base-color:var(--stage-good)">A</div><div class="biology-base-tile" style="--biology-base-color:var(--stage-danger)">T</div><div class="biology-base-tile" style="--biology-base-color:var(--stage-accent)">C</div></div><div class="biology-molecule-row biology-rung-row" aria-hidden="true"><span class="biology-molecule-label"></span><div class="biology-rung">┊</div><div class="biology-rung">┊</div><div class="biology-rung">┊</div><div class="biology-rung">┊</div><div class="biology-rung">┊</div><div class="biology-rung">┊</div><div class="biology-rung">┊</div><div class="biology-rung">┊</div></div><div class="biology-molecule-row biology-partner-row"><span class="biology-molecule-label">new strand</span><button class="biology-sequence-slot" data-variant="ghost" type="button" aria-label="empty slot under T">?</button><button class="biology-sequence-slot" data-variant="ghost" type="button" aria-label="empty slot under A">?</button><button class="biology-sequence-slot" data-variant="ghost" type="button" aria-label="empty slot under C">?</button><button class="biology-sequence-slot" data-variant="ghost" type="button" aria-label="empty slot under G">?</button><button class="biology-sequence-slot" data-variant="ghost" type="button" aria-label="empty slot under G">?</button><button class="biology-sequence-slot" data-variant="ghost" type="button" aria-label="empty slot under A">?</button><button class="biology-sequence-slot" data-variant="ghost" type="button" aria-label="empty slot under T">?</button><button class="biology-sequence-slot" data-variant="ghost" type="button" aria-label="empty slot under C">?</button></div></div></section><details class="lab-activity-inspector"><summary>Sequence palette and construction evidence</summary><div class="lab-activity-inspector-body"><div class="biology-sequence-controls"><span class="lab-field-label">Choose a base</span><div class="lab-field-row" role="group" aria-label="Base palette"><button class="lab-chip" data-variant="outline" data-size="sm" type="button" data-sel="false" aria-pressed="false"><span class="biology-base-choice" style="--biology-base-color:var(--stage-good)">A</span></button><button class="lab-chip" data-variant="outline" data-size="sm" type="button" data-sel="false" aria-pressed="false"><span class="biology-base-choice" style="--biology-base-color:var(--stage-accent)">C</span></button><button class="lab-chip" data-variant="outline" data-size="sm" type="button" data-sel="false" aria-pressed="false"><span class="biology-base-choice" style="--biology-base-color:var(--stage-accent-2)">G</span></button><button class="lab-chip" data-variant="outline" data-size="sm" type="button" data-sel="false" aria-pressed="false"><span class="biology-base-choice" style="--biology-base-color:var(--stage-danger)">T</span></button></div><span class="lab-pill" data-variant="outline" data-state="no">0/8 paired</span><p class="biology-sequence-guidance">Choose one option, then place it in the matching slot. A correct match locks in place.</p></div></div></details></div><div class="lab-activity-feedback"><span>Observe</span><div>Pair each template unit using the complementary-base rule.</div></div><section class="lab-authored-task" aria-label="Transfer the sequence rule"><div class="lab-challenge"><span class="lab-challenge-h">Transfer the sequence rule</span><div class="lab-challenge-q" data-response-layout="prose"><span class="lab-challenge-prompt"><span>Why is DNA replication called semiconservative?</span></span><div role="radiogroup" class="lab-choices" data-slot="toggle-group" data-orientation="horizontal" aria-label="Why is DNA replication called semiconservative?"><button type="button" class="lab-choice" data-slot="toggle-group-item" data-state="off" aria-pressed="false" role="radio" aria-checked="false" tabindex="0">each daughter DNA keeps one old strand and builds one new strand</button><button type="button" class="lab-choice" data-slot="toggle-group-item" data-state="off" aria-pressed="false" role="radio" aria-checked="false" tabindex="-1">both daughter strands are entirely old</button></div></div></div></section><div aria-live="polite" class="lab-sr-only">0 of 8 paired.</div><footer class="lab-activity-transport"><button class="lab-icon-button" data-variant="outline" data-size="icon-sm" type="button" aria-label="Reset sequence construction" title="Reset sequence construction"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-rotate-ccw" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg></button><div class="lab-transport-state" aria-live="polite"><strong>Build the partner sequence</strong><span>0 / 8 correct</span></div></footer></div>