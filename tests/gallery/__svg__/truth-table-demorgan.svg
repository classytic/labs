<div class="not-prose lab-activity discrete-truth-table-activity" data-focus-layout="standard"><header class="lab-activity-header"><div class="lab-activity-heading"><span class="lab-activity-eyebrow">Propositional logic</span><h3>Truth table</h3><div class="lab-activity-description">Change inputs, complete or inspect the output column, and connect its pattern to logical classification.</div></div></header><div class="lab-activity-status"><strong>Equivalent</strong><span>2 variables</span><span>4 rows</span></div><div class="lab-activity-workspace"><section class="lab-activity-canvas" aria-label="Truth table and live evaluator"><div class="logic-table-scroll"><table class="logic-truth-table"><thead><tr><th data-variable="true">p</th><th data-variable="true">q</th><th data-expression-start="true" data-final="false"><span><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="normal">¬</mi><mrow><mo fence="true">(</mo><mi>p</mi><mo>∧</mo><mi>q</mi><mo fence="true">)</mo></mrow></mrow><annotation encoding="application/x-tex">\neg \left(p \land q\right)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord">¬</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="minner"><span class="mopen delimcenter" style="top:0em;">(</span><span class="mord mathnormal">p</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">∧</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">q</span><span class="mclose delimcenter" style="top:0em;">)</span></span></span></span></span></span></th><th data-expression-start="false" data-final="true"><span><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantic