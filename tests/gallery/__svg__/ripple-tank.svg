<div class="not-prose lab-activity lab-authored-activity physics-wave" data-focus-layout="immersive" data-inspector-layout="stacked"><header class="lab-activity-header"><div class="lab-activity-heading"><span class="lab-activity-eyebrow">Waves</span><h3>Ripple tank: two-source interference</h3></div></header><div class="lab-activity-status"><span>Predict the pattern</span><span>Live ripples</span><span>λ 0.100</span><span>spacing 0.30</span></div><section class="lab-authored-task" aria-label="Your task"><p class="lab-authored-task-lead">Commit to what you expect before playing the model.</p></section><div class="lab-activity-workspace"><section class="lab-activity-canvas" aria-label="Ripple tank: two-source interference model"><div class="physics-scene-surface physics-wave-scene" data-tone="grid"><div style="width:100%"><canvas role="img" aria-label="Ripple tank with two movable coherent sources" style="display:block;width:100%;height:320px;touch-action:none;cursor:crosshair"></canvas></div></div></section><section class="lab-activity-dock" aria-label="Model controls"><section class="lab-activity-fields lab-authored-controls" aria-label="Controls"><div class="lab-field-row"><button class="lab-btn lab-primary-action" data-variant="default" type="button" aria-pressed="false"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-play" aria-hidden="true"><path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"></path></svg>Play</button><button class="lab-icon-button" data-variant="outline" data-size="icon-sm" type="button" aria-label="Reset wave" title="Reset wave"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-rotate-ccw" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg></button></div><span class="lab-field"><span class="lab-field-label">view</span><span class="lab-field-row"><div role="group" class="lab-segmented" data-slot="toggle-group" data-orientation="horizontal" aria-label="view"><button type="button" class="lab-segment" data-slot="toggle-group-item" data-state="on" aria-pressed="true" data-sel="true">ripples</button><button type="button" class="lab-segment" data-slot="toggle-group-item" data-state="off" aria-pressed="false" data-sel="false">fringes</button></div></span></span><span class="lab-field"><span class="lab-field-label">wavelength</span><span class="lab-field-row"><input type="range" class="lab-slider" min="0.05" max="0.2" step="0.005" data-slot="slider" aria-label="wavelength" value="0.1"/><span class="lab-field-val">0.100</span></span></span><span class="lab-field"><span class="lab-field-label">source separation</span><span class="lab-field-row"><input type="range" class="lab-slider" min="0.12" max="0.76" step="0.02" data-slot="slider" aria-label="distance between the two sources" value="0.30000000000000004"/><span class="lab-field-val">0.30</span></span></span><p class="physics-control-hint">Drag either source, or use source separation with keyboard or touch.</p></section></section><details class="lab-activity-inspector"><summary>Explore evidence</summary><div class="lab-activity-inspector-body"><section class="lab-authored-evidence" aria-label="Evidence"><div class="physics-probe physics-wave-relations"><span>interference</span><div><span><span class="physics-wave-constructive">bright</span>, crests meet · <span><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="normal">Δ</mi><mo>=</mo><mi>n</mi><mi>λ</mi></mrow><annotation encoding="application/x-tex">\Delta = n\lambda</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6833em;"></span><span class="mord">Δ</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.6944em;"></span><span class="mord mathnormal">nλ</span></span></span></span></span></span><span><span class="physics-wave-destructive">dark</span>, crest + trough · <span><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="normal">Δ</mi><mo>=</mo><mrow><mo fence="true">(</mo><mi>n</mi><mo>+</mo><mstyle scriptlevel="0" displaystyle="false"><mfrac><mn>1</mn><mn>2</mn></mfrac></mstyle><mo fence="true">)</mo></mrow><mi>λ</mi></mrow><annotation encoding="application/x-tex">\Delta = \left(n + \tfrac12\right)\lambda</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6833em;"></span><span class="mord">Δ</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:1.2em;vertical-align:-0.35em;"></span><span class="minner"><span class="mopen delimcenter" style="top:0em;"><span class="delimsizing size1">(</span></span><span class="mord mathnormal">n</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mord"><span class="mopen nulldelimiter"></span><span class="mfrac"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.8451em;"><span style="top:-2.655em;"><span class="pstrut" style="height:3em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight">2</span></span></span></span><span style="top:-3.23em;"><span class="pstrut" style="height:3em;"></span><span class="frac-line" style="border-bottom-width:0.04em;"></span></span><span style="top:-3.394em;"><span class="pstrut" style="height:3em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight">1</span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.345em;"><span></span></span></span></span></span><span class="mclose nulldelimiter"></span></span><span class="mclose delimcenter" style="top:0em;"><span class="delimsizing size1">)</span></span></span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal">λ</span></span></span></span></span></span></div></div><p class="physics-explain">Live ripples, watch crests collide. The still (grey) lines between the churn are where the waves cancel. Shorter wavelength or wider sources → more, tighter fringes.</p></section></div></details></div><div class="lab-activity-feedback"><span>Observe</span><div>Where two crests meet they reinforce; where a crest meets a trough they cancel.</div></div><details class="lab-activity-transcript"><summary>Learning support</summary><section class="lab-authored-transcript" aria-label="Event transcript"><p>Live ripples wave experiment with accessible live measurements.</p></section><section class="lab-authored-support"></section></details><footer class="lab-activity-transport"><nav class="lab-sequence" aria-label="Learning activity steps"><div class="lab-sequence-actions"><button class="lab-btn lab-btn-ghost" data-variant="outline" type="button" disabled="" aria-label="Back">← Back</button><span class="lab-sequence-count" aria-live="polite">1 / 5</span><button class="lab-btn" data-variant="default" type="button">Continue</button></div></nav></footer></div>