<svg width="640" height="384" viewBox="0 0 640 384" role="group" aria-label="AC versus DC: source, wire, lamp, water analogy and a live scope, all driven by one signal" class="stage-canvas" style="background:var(--stage-bg)"><defs><marker id="stage-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"></path></marker></defs><g data-stage-content="true"><defs><linearGradient id="stage-grad-metal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="color-mix(in oklab, var(--stage-metal) 85%, white)"></stop><stop offset="1" stop-color="var(--stage-metal)"></stop></linearGradient><linearGradient id="stage-grad-weight" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="color-mix(in oklab, var(--stage-weight) 78%, white)"></stop><stop offset="1" stop-color="var(--stage-weight)"></stop></linearGradient><linearGradient id="stage-grad-weight-2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="color-mix(in oklab, var(--stage-weight-2) 78%, white)"></stop><stop offset="1" stop-color="var(--stage-weight-2)"></stop></linearGradient><filter id="stage-soft-shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.8" flood-color="#000" flood-opacity="0.28"></feDropShadow></filter><filter id="stage-glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur in="SourceGraphic" stdDeviation="2.4" result="b"></feGaussianBlur><feMerge><feMergeNode in="b"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge></filter><filter id="stage-bloom" x="-120%" y="-120%" width="340%" height="340%"><feGaussianBlur in="SourceGraphic" stdDeviation="6" result="b1"></feGaussianBlur><feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="b2"></feGaussianBlur><feMerge><feMergeNode in="b1"></feMergeNode><feMergeNode in="b2"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge></filter><radialGradient