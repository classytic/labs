<div class="not-prose lab-activity discrete-expected-value-activity" data-focus-layout="standard"><header class="lab-activity-header"><div class="lab-activity-heading"><span class="lab-activity-eyebrow">Expected value</span><h3>Expected value: is the game fair?</h3><div class="lab-activity-description">Balance each outcome’s value against its probability, then test the predicted long-run payout by simulation.</div></div></header><div class="lab-activity-status"><strong>house edge</strong><span>E[X] 3.75</span><span>cost 5.00</span><span>0 plays</span></div><div class="lab-activity-workspace"><section class="lab-activity-canvas" aria-label="Expected-value balance and running average"><div class="probability-contribution-board" role="img" aria-label="Expected payout 3.75"><div class="probability-board-heading"><span>Every 100 plays</span><span>Probability × payout</span></div><div class="probability-outcome-strip" aria-hidden="true"><div class="probability-outcome-segment" style="--probability-width:70%;--probability-color:var(--stage-cat-1)"><strong>70%</strong><span>lose</span></div><div class="probability-outcome-segment" style="--probability-width:25%;--probability-color:var(--stage-cat-2)"><strong>25%</strong><span>small</span></div><div class="probability-outcome-segment" style="--probability-width:5%;--probability-color:var(--stage-cat-3)"><strong>5%</strong><span>jackpot</span></div></div><div class="probability-contribution-list"><div class="probability-contribution-row"><span class="probability-contribution-label">lose</span><span class="probability-contribution-track" aria-hidden="true"><span class="probability-contribution-fill" style="--contribution-width:0%;--probability-color:var(--stage-cat-1)"></span></span><span class="probability-contribution-math">70% × 0 = <strong>0.00</strong></span></div><div class="probability-contribution-row"><span class="probability-contribution-label">small</span><span class="probability-contribution-track" aria-hidden="true"><span class="probability-contribution-fill" style="--contribution-width:22.32142857142857%;--probability-color:var(--stage-cat-2)"></span></span><span class="probability-contribution-math">25% × 5 = <strong>1.25</strong></span></div><div class="probability-contribution-row"><span class="probability-contribution-label">jackpot</span><span class="probability-contribution-track" aria-hidden="true"><span class="probability-contribution-fill" style="--contribution-width:44.64285714285714%;--probability-color:var(--stage-cat-3)"></span></span><span class="probability-contribution-math">5% × 50 = <strong>2.50</strong></span></div></div><div class="probability-benchmark"><div class="probability-benchmark-track" aria-hidden="true"><span class="probability-expectation-fill" style="--benchmark-width:66.96428571428571%"></span><span class="probability-cost-marker" style="--marker-position:89.28571428571428%"></span></div><div class="probability-benchmark-legend"><span><i data-kind="expectation"></i> expected 3.75</span><span><i data-kind="cost"></i> price 5.00</span></div></div></div></section><details class="lab-activity-inspector"><summary>Expected-value evidence and game controls</summary><div class="lab-activity-inspector-body"><div class="lab-evidence-surface" data-tone="result"><span class="lab-readout"><span class="lab-readout-label">expected value</span><span class="lab-readout-val">3.75</span><span class="lab-readout-sub"><span class="expected-value-verdict" data-fair="false">house edge 1.25/play</span></span></span></div><div class="expected-value-equation"><span class="discrete-muted"><span><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>E</mi><mo stretchy="false">[</mo><mi>X</mi><mo stretchy="false">]</mo><mo>=</mo><mo>∑</mo><mtext>value</mtext><mo>⋅</mo><mtext>prob</mtext></mrow><annotation encoding="application/x-tex">E[X] = \sum \text{value} \cdot \text{prob}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.0576em;">E</span><span class="mopen">[</span><span class="mord mathnormal" style="margin-right:0.0785em;">X</span><span class="mclose">]</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mop op-symbol small-op" style="position:relative;top:0em;">∑</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord text"><span class="mord">value</span></span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">⋅</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.8889em;vertical-align:-0.1944em;"></span><span class="mord text"><span class="mord">prob</span></span></span></span></span></span></span><span><span><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo>=</mo><mn>0</mn><mo>⋅</mo><mn>70</mn><mi mathvariant="normal">%</mi><mo>+</mo><mn>5</mn><mo>⋅</mo><mn>25</mn><mi mathvariant="normal">%</mi><mo>+</mo><mn>50</mn><mo>⋅</mo><mn>5</mn><mi mathvariant="normal">%</mi></mrow><annotation encoding="application/x-tex">= 0 \cdot 70\% + 5 \cdot 25\% + 50 \cdot 5\%</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.3669em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.6444em;"></span><span class="mord">0</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">⋅</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.8333em;vertical-align:-0.0833em;"></span><span class="mord">70%</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.6444em;"></span><span class="mord">5</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">⋅</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.8333em;vertical-align:-0.0833em;"></span><span class="mord">25%</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.6444em;"></span><span class="mord">50</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">⋅</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.8056em;vertical-align:-0.0556em;"></span><span class="mord">5%</span></span></span></span></span></span><span>= <b class="discrete-answer">3.75</b></span></div><div><p class="lab-prompt expected-value-prompt">Play it for real, the average payout homes in on E[X].</p></div><div class="lab-activity-fields"><span class="lab-field"><span class="lab-field-label">lose prob</span><span class="lab-field-row"><input type="range" class="lab-slider" min="0" max="1" step="0.05" data-slot="slider" aria-label="prob lose" value="0.7"/><span class="lab-field-val">70%</span></span></span><span class="lab-field"><span class="lab-field-label">small prob</span><span class="lab-field-row"><input type="range" class="lab-slider" min="0" max="1" step="0.05" data-slot="slider" aria-label="prob small" value="0.25"/><span class="lab-field-val">25%</span></span></span><span class="lab-field"><span class="lab-field-label">jackpot prob</span><span class="lab-field-row"><input type="range" class="lab-slider" min="0" max="1" step="0.05" data-slot="slider" aria-label="prob jackpot" value="0.05"/><span class="lab-field-val">5%</span></span></span><span class="lab-field"><span class="lab-field-label">value (last)</span><span class="lab-field-row"><span class="lab-stepper" role="group" aria-label="last outcome value"><button data-variant="ghost" data-size="icon-sm" type="button" aria-label="decrease last outcome value">−</button><b>50</b><button data-variant="ghost" data-size="icon-sm" type="button" aria-label="increase last outcome value">+</button></span></span></span></div></div></details></div><div class="lab-activity-feedback"><span>Observe</span><div>The probability-weighted balance point is 3.75, so the expected net per play is -1.25.</div></div><section class="lab-authored-task" aria-label="Predict whether the game is fair"><div class="lab-challenge"><span class="lab-challenge-h">Predict first</span><fieldset class="lab-challenge-q" data-response-layout="prose"><legend class="lab-challenge-prompt"><span>Before simulating: with a cost of 5, does this game&#x27;s expected payout favour the player?</span></legend><div role="radiogroup" class="lab-choices" data-slot="radio-group" aria-label="Before simulating: with a cost of 5, does this game&#x27;s expected payout favour the player?"><label for="_R_id_-player" class="lab-choice"><button type="button" role="radio" class="lab-choice-control" aria-checked="false" data-slot="radio-group-item" id="_R_id_-player"></button><span class="lab-choice-label">yes, expected payout covers the cost</span></label><label for="_R_id_-house" class="lab-choice"><button type="button" role="radio" class="lab-choice-control" aria-checked="false" data-slot="radio-group-item" id="_R_id_-house"></button><span class="lab-choice-label">no, the house has an edge</span></label></div></fieldset></div></section><div aria-live="polite" class="lab-sr-only">Expected payout 3.75 against cost 5.00. House edge 1.25 per play.</div><footer class="lab-activity-transport"><button class="lab-icon-button" data-variant="outline" data-size="icon-sm" type="button" aria-label="reset game" title="reset game"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-rotate-ccw" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg></button><div class="lab-transport-state" aria-live="polite"><strong>Ready to simulate</strong><span>E[X] 3.75</span></div><button class="lab-btn lab-primary-action" data-variant="default" type="button">Simulate 50 plays</button><button class="lab-btn" data-variant="default" type="button">Play once</button></footer></div>