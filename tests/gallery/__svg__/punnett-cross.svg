<div class="not-prose lab-activity biology-genetic-cross-activity" data-focus-layout="immersive"><header class="lab-activity-header"><div class="lab-activity-heading"><span class="lab-activity-eyebrow">Inheritance</span><h3>The 3:1 you can count</h3><div class="lab-activity-description">Cross two parents: alleles segregate into gametes, recombine, and the ratio falls out.</div></div></header><div class="lab-activity-status"><strong>trait revealed</strong><span>2 × 2 pairings</span><span>ratio 3:1</span></div><div class="lab-activity-workspace"><section class="lab-activity-canvas" aria-label="Punnett grid and parent gametes"><p class="genetic-legend"><span>Trait: trait · <span><b class="genetic-phenotype" style="--genetic-color:var(--stage-accent)">A</b>=tall, </span><span><b class="genetic-phenotype" style="--genetic-color:var(--stage-muted)">a</b>=short</span></span></p><div class="biology-model-surface genetic-cross-scene"><div role="table" class="genetic-cross-grid" aria-label="Punnett grid, 2 by 2. trait ratio 3 tall, 1 short." style="--genetic-cell-size:54px;--genetic-columns:2;--genetic-font-size:17px"><div role="row" class="genetic-cross-row"><div role="columnheader" aria-hidden="true" class="genetic-cross-corner"></div><div role="columnheader" class="genetic-cross-column-header">A</div><div role="columnheader" class="genetic-cross-column-header">a</div></div><div role="row" class="genetic-cross-row"><div role="rowheader" class="genetic-cross-row-header">A</div><button class="genetic-cross-cell" data-variant="ghost" type="button" role="cell" data-revealed="true" aria-label="A × A → AA, tall" title="AA → tall" style="--genetic-cell-bg:color-mix(in oklab, var(--stage-accent) 13%, var(--stage-bg))">AA</button><button class="genetic-cross-cell" data-variant="ghost" type="button" role="cell" data-revealed="true" aria-label="A × a → Aa, tall" title="Aa → tall" style="--genetic-cell-bg:color-mix(in oklab, var(--stage-accent) 13%, var(--stage-bg))">Aa</button></div><div role="row" class="genetic-cross-row"><div role="rowheader" class="genetic-cross-row-header">a</div><button class="genetic-cross-cell" data-variant="ghost" type="button" role="cell" data-revealed="true" aria-label="a × A → Aa, tall" title="Aa → tall" style="--genetic-cell-bg:color-mix(in oklab, var(--stage-accent) 13%, var(--stage-bg))">Aa</button><button class="genetic-cross-cell" data-variant="ghost" type="button" role="cell" data-revealed="true" aria-label="a × a → aa, short" title="aa → short" style="--genetic-cell-bg:color-mix(in oklab, var(--stage-muted) 13%, var(--stage-bg))">aa</button></div></div></div></section><details class="lab-activity-inspector"><summary>Parent alleles and offspring evidence</summary><div class="lab-activity-inspector-body"><div class="genetic-cross-inspector"><div class="genetic-parent-controls"><span class="genetic-parent-row">Parent 1:<span class="genetic-allele-pair"><button class="lab-chip genetic-allele-button" data-variant="outline" data-size="sm" type="button" style="--genetic-color:var(--stage-accent)" aria-label="Parent 1 gene 1 allele 1: A, tap to change">A</button><button class="lab-chip genetic-allele-button" data-variant="outline" data-size="sm" type="button" style="--genetic-color:var(--stage-muted)" aria-label="Parent 1 gene 1 allele 2: a, tap to change">a</button></span></span><span class="genetic-parent-row">Parent 2:<span class="genetic-allele-pair"><button class="lab-chip genetic-allele-button" data-variant="outline" data-size="sm" type="button" style="--genetic-color:var(--stage-accent)" aria-label="Parent 2 gene 1 allele 1: A, tap to change">A</button><button class="lab-chip genetic-allele-button" data-variant="outline" data-size="sm" type="button" style="--genetic-color:var(--stage-muted)" aria-label="Parent 2 gene 1 allele 2: a, tap to change">a</button></span></span><span class="genetic-control-hint">(tap an allele to cycle it)</span></div><div class="genetic-tally-stack"><div class="genetic-tally"><div class="genetic-tally-label">Genotype: 1 AA : 2 Aa : 1 aa</div><div class="genetic-tally-bar"><div class="genetic-tally-segment" style="--genetic-share:0.25;--genetic-color:var(--stage-accent)">1</div><div class="genetic-tally-segment" style="--genetic-share:0.5;--genetic-color:var(--stage-accent)">2</div><div class="genetic-tally-segment" style="--genetic-share:0.25;--genetic-color:var(--stage-muted)">1</div></div></div><div class="genetic-tally"><div class="genetic-tally-label">trait: 3 tall : 1 short</div><div class="genetic-tally-bar"><div class="genetic-tally-segment" style="--genetic-share:0.75;--genetic-color:var(--stage-accent)">3</div><div class="genetic-tally-segment" style="--genetic-share:0.25;--genetic-color:var(--stage-muted)">1</div></div></div><span class="lab-pill" data-variant="secondary" data-state="ok">3:1 tall : short</span></div></div></div></details></div><div class="lab-activity-feedback"><span>Observe</span><div>Each box represents one possible offspring outcome. Counting the trait outcomes gives 3:1.</div></div><div aria-live="polite" class="lab-sr-only">trait ratio 3 tall, 1 short.</div><footer class="lab-activity-transport"><div class="lab-transport-state" aria-live="polite"><strong>Cross revealed</strong><span>4 offspring outcomes</span></div></footer></div>